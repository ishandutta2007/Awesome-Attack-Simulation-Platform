<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Glowing Text & Line Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Accent Gradients -->
    <linearGradient id="primaryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d4a" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: url(#primaryText);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    .node-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
    .line-flow {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    .node-orbit {
      animation: orbit 12s linear infinite;
      transform-origin: 1050px 200px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="400" fill="url(#cyberGrid)" rx="16"/>

  <!-- Dynamic Cyber Attack Simulation Visuals (Right Background Side) -->
  <g opacity="0.6">
    <!-- Connecting Attack Vectors -->
    <path class="line-flow" d="M 750 120 L 900 180 L 1050 120 L 1000 280 L 850 260 Z" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
    <path class="line-flow" d="M 800 200 L 950 100 L 1100 220 L 900 320 Z" fill="none" stroke="#ff416c" stroke-width="1.5" opacity="0.5"/>

    <!-- Nodes / Attack Simulation Targets -->
    <circle cx="750" cy="120" r="8" fill="url(#redAccent)" filter="url(#subtleGlow)"/>
    <circle cx="900" cy="180" r="12" fill="url(#blueAccent)" filter="url(#glow)" class="node-pulse"/>
    <circle cx="1050" cy="120" r="9" fill="url(#redAccent)" filter="url(#subtleGlow)"/>
    <circle cx="1000" cy="280" r="14" fill="url(#primaryText)" filter="url(#glow)"/>
    <circle cx="850" cy="260" r="7" fill="url(#blueAccent)"/>
    <circle cx="950" cy="100" r="10" fill="url(#redAccent)" class="node-pulse"/>
    <circle cx="1100" cy="220" r="8" fill="url(#blueAccent)"/>
    <circle cx="900" cy="320" r="11" fill="url(#redAccent)"/>

    <!-- Radar Sweep Effect Background Rings -->
    <circle cx="950" cy="200" r="140" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <circle cx="950" cy="200" r="90" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Foreground Title Card (High Contrast & Clear Readability) -->
  <g transform="translate(70, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 75)">
      <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">
        ⚔️ CYBERSECURITY LANDSCAPE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title" filter="url(#subtleGlow)">
      Awesome Attack Simulation
    </text>
    <text x="0" y="215" class="title" fill="#ffffff">
      Platform Ecosystem 🛡️
    </text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">
      Breach &amp; Attack Simulation (BAS) • Adversary Emulation • Continuous Security Validation
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#ff416c" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#ff758c">🔴 Red Teaming</text>

      <rect x="142" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="207" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🔵 Blue Teaming</text>

      <rect x="284" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="354" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc">🟣 Purple Teaming</text>

      <rect x="436" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <text x="511" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#4ade80">🎯 MITRE ATT&amp;CK</text>
    </g>
  </g>
</svg>
